<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Demo Walkthrough — Sep 10, 2026</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #1f2630;
    --border: #2d3641;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4f8ff7;
    --accent2: #79b8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
  }

  /* progress bar */
  #progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; z-index: 100; transition: width .25s ease; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header .title { font-size: 15px; font-weight: 650; white-space: nowrap; }
  header .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  header .spacer { flex: 1; }
  .btn {
    background: var(--bg3); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    user-select: none; white-space: nowrap;
  }
  .btn:hover { background: #29313d; border-color: #3d4753; }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn kbd {
    font-family: inherit; font-size: 10px; opacity: .65;
    border: 1px solid currentColor; border-radius: 4px; padding: 0 4px;
  }

  /* stage */
  #stage { flex: 1; position: relative; overflow: hidden; background: #090c10; }
  #frameWrap {
    position: absolute; inset: 14px 14px 0 14px;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }
  #frameWrap.fit { overflow: hidden; }
  #frameWrap.pan { cursor: grab; }
  #frameWrap.pan:active { cursor: grabbing; }
  #frame { display: block; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.55); }
  .fit #frame { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  .pan #frame { max-width: none; max-height: none; image-rendering: auto; }

  .navzone { position: absolute; top: 0; bottom: 90px; width: 18%; z-index: 5; cursor: pointer; display: flex; align-items: center; opacity: 0; transition: opacity .15s; }
  .navzone:hover { opacity: 1; }
  #zoneLeft { left: 0; background: linear-gradient(90deg, rgba(0,0,0,.35), transparent); }
  #zoneRight { right: 0; background: linear-gradient(-90deg, rgba(0,0,0,.35), transparent); }
  .navzone .arrow {
    font-size: 34px; color: #fff; background: rgba(20,26,34,.75);
    border: 1px solid rgba(255,255,255,.14); border-radius: 50%;
    width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
    margin: 0 22px; backdrop-filter: blur(4px);
  }

  /* caption bar */
  #captionBar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 96px; z-index: 6;
    display: flex; align-items: center; gap: 12px;
    background: rgba(13,17,23,.88); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 18px;
    max-width: min(860px, 86vw); backdrop-filter: blur(8px);
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #stepNum {
    font-size: 12px; font-weight: 700; color: #fff;
    background: var(--accent); border-radius: 8px; padding: 4px 9px;
    white-space: nowrap;
  }
  #stepTime { font-size: 12px; color: var(--accent2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #stepCap { font-size: 13.5px; line-height: 1.35; }

  /* filmstrip */
  #strip {
    flex-shrink: 0; display: flex; gap: 6px; align-items: center;
    padding: 10px 14px; background: var(--bg2); border-top: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: thin;
  }
  #strip.hide { display: none; }
  .thumb {
    flex: 0 0 auto; width: 118px; height: 66px; border-radius: 6px;
    border: 2px solid var(--border); overflow: hidden; cursor: pointer;
    position: relative; background: #000; opacity: .72; transition: opacity .12s, border-color .12s;
  }
  .thumb:hover { opacity: 1; }
  .thumb.active { border-color: var(--accent); opacity: 1; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .thumb .tnum {
    position: absolute; left: 4px; top: 4px; font-size: 9.5px; font-weight: 700;
    background: rgba(0,0,0,.72); color: #fff; border-radius: 4px; padding: 1px 5px;
  }
  #strip::-webkit-scrollbar { height: 8px; }
  #strip::-webkit-scrollbar-thumb { background: #2d3641; border-radius: 4px; }

  /* grid overview */
  #grid {
    position: fixed; inset: 0; z-index: 50; background: rgba(9,12,16,.97);
    overflow-y: auto; padding: 70px 26px 30px; display: none;
  }
  #grid.open { display: block; }
  #grid h2 { position: fixed; top: 0; left: 0; right: 0; background: rgba(13,17,23,.95); padding: 16px 26px; font-size: 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; z-index: 2; }
  #gridClose { margin-left: auto; }
  .gridwrap { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 8px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color .12s, transform .12s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card.current { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,143,247,.35); }
  .card .imgbox { height: 135px; overflow: hidden; background: #000; position: relative; }
  .card .imgbox img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .card .meta { padding: 8px 10px 10px; }
  .card .meta .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .card .n { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 5px; padding: 1px 6px; }
  .card .t { font-size: 11px; color: var(--accent2); font-variant-numeric: tabular-nums; }
  .card .c { font-size: 12px; color: var(--muted); line-height: 1.35; }

  #counter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #autoplayWrap { display: flex; align-items: center; gap: 6px; }

  @media (max-width: 900px) {
    header .sub { display: none; }
    #captionBar { bottom: 84px; }
  }
</style>
</head>
<body>

<div id="progress"></div>

<header>
  <div>
    <div class="title">Product Demo Walkthrough</div>
    <div class="sub">68 frames &middot; captured Thu Sep 10, 2026 &middot; 15:26 – 15:41 &middot; full-resolution originals</div>
  </div>
  <div class="spacer"></div>
  <div id="counter">1 / 68</div>
  <button class="btn" id="zoomBtn" title="Toggle 1:1 pixels (Z)"><span>1:1</span></button>
  <button class="btn" id="gridBtn" title="Overview grid (G)"><span>Grid</span><kbd>G</kbd></button>
  <button class="btn" id="stripBtn" title="Toggle filmstrip (T)"><span>Filmstrip</span></button>
  <div id="autoplayWrap">
    <button class="btn" id="playBtn" title="Autoplay (P)"><span>Play</span><kbd>P</kbd></button>
  </div>
  <button class="btn" id="fsBtn" title="Fullscreen (F)"><span>Fullscreen</span><kbd>F</kbd></button>
</header>

<div id="stage">
  <div id="frameWrap" class="fit"><img id="frame" src="" alt="demo frame"></div>
  <div class="navzone" id="zoneLeft"><div class="arrow">&#8249;</div></div>
  <div class="navzone" id="zoneRight"><div class="arrow">&#8250;</div></div>
  <div id="captionBar">
    <span id="stepNum">1</span>
    <span id="stepTime">15:18:31</span>
    <span id="stepCap"></span>
  </div>
</div>

<div id="strip"></div>

<div id="grid">
  <h2>All frames — click to jump
    <button class="btn" id="gridClose">Close (Esc)</button>
  </h2>
  <div class="gridwrap" id="gridWrap"></div>
</div>

<script>
const T = ["15:26:13","15:26:39","15:27:05","15:27:14","15:27:33","15:27:38","15:27:43","15:27:54","15:28:12","15:28:19","15:28:47","15:28:58","15:29:05","15:29:14","15:29:26","15:29:35","15:29:44","15:29:51","15:30:09","15:30:27","15:30:39","15:30:47","15:31:02","15:31:11","15:31:26","15:31:34","15:31:49","15:32:08","15:32:34","15:32:47","15:33:04","15:33:19","15:33:26","15:33:39","15:33:53","15:34:04","15:34:18","15:34:39","15:34:43","15:35:05","15:35:11","15:35:17","15:35:25","15:35:34","15:35:43","15:35:55","15:35:59","15:36:23","15:36:33","15:36:37","15:37:38","15:37:51","15:38:52","15:38:59","15:39:06","15:39:13","15:39:19","15:39:24","15:39:45","15:40:11","15:40:27","15:40:53","15:41:00","15:41:06","15:41:11","15:41:15","15:41:20","15:41:25"];

const CAP = [
"Xactly Plan Segment Modeling with segment classification donut charts",
"Coverage Modeling summary cards and segment distribution charts",
"Capacity role activity table with headcount and cost KPIs",
"Capacity Modeling KPIs with AI-generated attrition and ramp drivers",
"Territories menu opened over attrition and ramp tables",
"Territory Models list with US Districts highlighted",
"US Districts territory map with TAM ranking bar chart",
"Chicago territory drill-in showing zip-level account map detail",
"Quota Top-Down Planning with allocation KPIs and Auto Allocate",
"Plan Hub dashboard with active plans and payout totals",
"Financial Targets Dashboard comparing fiscal year bookings growth",
"Rate Components scenario list with search and duplicate options",
"Duplicate Scenario panel naming increased-rate component copy",
"Edit Rate Table Component dialog with tier rates and lock-in-rate-change guidance",
"Rate Components page, Simulations menu open, move-to-simulations tooltip",
"Credit Simulations list with create button, set-your-benchmark tooltip",
"Create Simulation Scenario form selecting component scenario tooltip",
"Simulation Comparison side-by-side payout and performance dashboards",
"Publish Component To Incent dialog listing components, push-it-live tooltip",
"Xactly Manage welcome dialog over Manage Dashboard territory quota KPIs",
"Manage Dashboard KPI cards and charts with roster tooltip",
"Roster employee table with summary search, one-source-of-truth tooltip",
"Roster page with Territory Management menu open, deploy-your-team tooltip",
"Territory Models overview with model counts, turn-strategy-into-territory tooltip",
"Territory Models page with Quota Management menu, now-set-the-targets tooltip",
"Quota Management spread dashboard with quota metrics and monthly trend",
"Roster Add-New employee form open, your-roster-command-center tooltip",
"Quota by Account table with Account Details and quota adjustment tooltip",
"Credit rule editor with region and product type conditions",
"Credit Assignment dashboard with order totals and monthly credit charts",
"Incent admin workspace welcome tour over loading Commission Dashboard",
"Organization menu opened over commissions dashboard with earnings charts",
"Profiles list selecting sales rep Chris Walker",
"Sales rep profile details with user account and plan info",
"Plan Design menu open over profile hierarchy tree",
"Commission Rules list with no-code rule builder tooltip",
"Product Revenue commission rule editor with versioning tooltip",
"Commission rule version history with drill-in tooltip",
"Rule results section selecting rate table result type",
"Result rate type dropdown showing rate table options",
"Select Rate Table panel choosing annual target rates",
"Commission rule editor with report configuration menu and OOTB reports tooltip",
"Metrics list with create report template tooltip",
"Dashboard templates list, End User Dashboard highlighted",
"Template editor dragging header fields, customize tooltip",
"Template editor with preview-work-anytime tooltip",
"End user dashboard preview with commission donut and credits charts",
"Dashboard preview with document management menu tooltip",
"Plan document templates list with edit template tooltip",
"2025 Sales Representative Plan template editor with multilingual plan summary",
"Forecasting pipeline board with product tour welcome modal",
"Pipeline board opening quarter selector, quarter-glance tooltip",
"Pipeline grouped by sales stage, current quarter totals",
"Pipeline with category grouping dropdown, organize-your-way tooltip",
"Pipeline sort dropdown by opportunity health tooltip",
"Forecasting Opportunities kanban with Won, Commit, Upside, Pipeline totals",
"Opportunity Health panel opened on ABC Corp deal, 65% score",
"What-makes-a-deal-healthy tooltip over opportunities board",
"Full-360-on-every-deal tooltip with activity timeline open",
"Sent Emails panel listing outbound emails for the deal",
"Opportunities table view, Commit deals with health scores and stages",
"Administrator Workspace Home with Xactly Extensions welcome modal",
"Extensions menu, Payroll Dashboard highlighted, tailor-your-workspace tooltip",
"Payroll Dashboard KPIs and donut charts, automate-any-process tooltip",
"Extensions menu selecting Payroll Review, advanced-workflows tooltip",
"Payee Commissions summary table with customize-your-drill-downs tooltip",
"Commission Summary table with expose-more-detail tooltip on transactions",
"Initiate Adjustment form open, tailored-workflow-experience tooltip"
];

const N = T.length;
const img = n => "images/" + String(n).padStart(2, "0") + ".png";

let cur = 0;
let oneToOne = false;
let playing = false;
let playTimer = null;

const frame = document.getElementById("frame");
const frameWrap = document.getElementById("frameWrap");
const stepNum = document.getElementById("stepNum");
const stepTime = document.getElementById("stepTime");
const stepCap = document.getElementById("stepCap");
const counter = document.getElementById("counter");
const progress = document.getElementById("progress");
const strip = document.getElementById("strip");
const grid = document.getElementById("grid");
const gridWrap = document.getElementById("gridWrap");
const playBtn = document.getElementById("playBtn");
const zoomBtn = document.getElementById("zoomBtn");
const stripBtn = document.getElementById("stripBtn");
const gridBtn = document.getElementById("gridBtn");

function thumbFor(n) {
  const d = document.createElement("div");
  d.className = "thumb";
  d.dataset.n = n;
  d.innerHTML = '<span class="tnum">' + n + '</span><img loading="lazy" src="' + img(n) + '" alt="frame ' + n + '">';
  d.addEventListener("click", () => { go(n - 1); });
  return d;
}

for (let i = 1; i <= N; i++) strip.appendChild(thumbFor(i));

for (let i = 1; i <= N; i++) {
  const c = document.createElement("div");
  c.className = "card";
  c.dataset.n = i;
  c.innerHTML =
    '<div class="imgbox"><img loading="lazy" src="' + img(i) + '" alt="frame ' + i + '"></div>' +
    '<div class="meta"><div class="row1"><span class="n">' + i + '</span><span class="t">' + T[i-1] + '</span></div>' +
    '<div class="c">' + CAP[i-1] + '</div></div>';
  c.addEventListener("click", () => { closeGrid(); go(i - 1); });
  gridWrap.appendChild(c);
}

function go(i) {
  if (i < 0) i = N - 1;
  if (i >= N) i = 0;
  cur = i;
  frame.src = img(cur + 1);
  frame.alt = "Frame " + (cur + 1) + " — " + T[cur];
  stepNum.textContent = (cur + 1) + " / " + N;
  stepTime.textContent = T[cur];
  stepCap.textContent = CAP[cur];
  counter.textContent = (cur + 1) + " / " + N;
  progress.style.width = ((cur + 1) / N * 100) + "%";
  [...strip.children].forEach((el, k) => el.classList.toggle("active", k === cur));
  const act = strip.children[cur];
  if (act) {
    const l = act.offsetLeft, r = l + act.offsetWidth;
    if (l < strip.scrollLeft || r > strip.scrollLeft + strip.clientWidth) {
      strip.scrollTo({ left: l - strip.clientWidth / 2 + act.offsetWidth / 2, behavior: "smooth" });
    }
  }
  if (grid.classList.contains("open")) markGrid();
  if (oneToOne) resetZoom();
  frame.preload = "auto";
  const nx = new Image(); nx.src = img((cur + 1) % N + 1);
  const pv = new Image(); pv.src = img(((cur - 1 + N) % N) + 1);
}

function markGrid() {
  [...gridWrap.children].forEach(el => el.classList.toggle("current", +el.dataset.n === cur + 1));
  const c = gridWrap.children[cur];
  if (c) c.scrollIntoView({ block: "nearest" });
}

function openGrid() { grid.classList.add("open"); markGrid(); gridBtn.classList.add("active"); }
function closeGrid() { grid.classList.remove("open"); gridBtn.classList.remove("active"); }
function toggleGrid() { grid.classList.contains("open") ? closeGrid() : openGrid(); }

function setZoom(one) {
  oneToOne = one;
  frameWrap.classList.toggle("fit", !one);
  frameWrap.classList.toggle("pan", one);
  zoomBtn.classList.toggle("active", one);
  if (one) {
    frame.style.width = frame.naturalWidth + "px";
    frame.style.height = frame.naturalHeight + "px";
    frameWrap.scrollLeft = (frame.scrollWidth - frameWrap.clientWidth) / 2;
    frameWrap.scrollTop = (frame.scrollHeight - frameWrap.clientHeight) / 2;
  } else {
    frame.style.width = "";
    frame.style.height = "";
  }
}
function resetZoom() { setZoom(true); }
function toggleZoom() { setZoom(!oneToOne); }

function togglePlay() {
  playing = !playing;
  playBtn.classList.toggle("active", playing);
  playBtn.querySelector("span").textContent = playing ? "Pause" : "Play";
  if (playing) playTimer = setInterval(() => go(cur + 1), 4000);
  else clearInterval(playTimer);
}

let panStart = null;
frameWrap.addEventListener("mousedown", e => {
  if (!oneToOne) return;
  panStart = { x: e.clientX, y: e.clientY, sl: frameWrap.scrollLeft, st: frameWrap.scrollTop };
  e.preventDefault();
});
window.addEventListener("mousemove", e => {
  if (!panStart) return;
  frameWrap.scrollLeft = panStart.sl - (e.clientX - panStart.x);
  frameWrap.scrollTop = panStart.st - (e.clientY - panStart.y);
});
window.addEventListener("mouseup", () => panStart = null);

document.getElementById("zoneLeft").addEventListener("click", () => go(cur - 1));
document.getElementById("zoneRight").addEventListener("click", () => go(cur + 1));
gridBtn.addEventListener("click", toggleGrid);
document.getElementById("gridClose").addEventListener("click", closeGrid);
zoomBtn.addEventListener("click", toggleZoom);
playBtn.addEventListener("click", togglePlay);
stripBtn.addEventListener("click", () => { strip.classList.toggle("hide"); stripBtn.classList.toggle("active"); });
document.getElementById("fsBtn").addEventListener("click", () => {
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});

window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (grid.classList.contains("open")) return closeGrid();
    if (oneToOne) return setZoom(false);
    return;
  }
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(N - 1);
  else if (e.key === "g" || e.key === "G") toggleGrid();
  else if (e.key === "z" || e.key === "Z") toggleZoom();
  else if (e.key === "t" || e.key === "T") stripBtn.click();
  else if (e.key === "p" || e.key === "P") togglePlay();
  else if (e.key === "f" || e.key === "F") document.getElementById("fsBtn").click();
});

go(0);
</script>
</body>
</html>
