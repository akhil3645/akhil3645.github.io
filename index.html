<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akhil — Pages</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --border: #2d3641;
    --text: #e6edf3; --muted: #8b949e; --accent: #4f8ff7; --accent2: #79b8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 80px 24px 60px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .list { margin-top: 44px; width: min(720px, 100%); display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: flex; align-items: center; gap: 18px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 24px; text-decoration: none; color: var(--text);
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .info { flex: 1; }
  .card .t { font-size: 16px; font-weight: 650; }
  .card .d { font-size: 13px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
  .card .meta { text-align: right; flex-shrink: 0; }
  .card .date { font-size: 12px; color: var(--accent2); font-variant-numeric: tabular-nums; }
  .card .go { font-size: 20px; color: var(--muted); margin-top: 6px; }
  a.card:hover .go { color: var(--accent); }
  .empty { margin-top: 44px; color: var(--muted); font-size: 14px; }
  footer { margin-top: auto; padding-top: 60px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <h1>Pages</h1>
  <div class="sub">Demo walkthroughs and shareable pages — served straight from GitHub</div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>Nothing published yet.</div>
  <footer><a href="https://github.com/akhil3645/akhil3645.github.io">source on github</a></footer>
  <script src="pages.js"></script>
  <script>
    const list = document.getElementById("list");
    PAGES.forEach(p => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = p.url;
      a.innerHTML =
        '<div class="info"><div class="t">' + p.title + '</div><div class="d">' + p.desc + '</div></div>' +
        '<div class="meta"><div class="date">' + p.date + '</div><div class="go">&#8250;</div></div>';
      list.appendChild(a);
    });
    document.getElementById("empty").hidden = PAGES.length > 0;
  </script>
</body>
</html>
